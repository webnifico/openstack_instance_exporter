    description: Missing counters retain bounded stale severity, expire to unavailable, and recover from fresh data.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: temporary_missing_resource_counters, failure_cycles: 2}
    expected_metrics: [oie_instance_resource_axis_available, oie_instance_resource_axis_fresh, oie_instance_resource_axis_stale_seconds, oie_instance_resource_severity]
