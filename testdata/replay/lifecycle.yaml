    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: zone_identity_prevents_cross_tenant_carryover

  - id: exporter_restart
    description: Process restart clears in-memory persistence so one replayed observation cannot borrow old hits.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: exporter_restart}
    expected_metrics: [oie_instance_behavior_severity]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [candidate, restarted, candidate]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: new_process_requires_new_persistence

  - id: threat_feed_outage
    description: Loss of every usable threat source makes the combined score unavailable instead of healthy zero.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: threat_feed_outage, failure_cycles: 2}
