    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_complete_snapshot_replaces_retained

  - id: enobufs
    description: Kernel ENOBUFS loss invalidates both dumps and increments the bounded source-health counter.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: enobufs, failure_cycles: 3}
    expected_metrics: [oie_host_conntrack_raw_ok, oie_host_conntrack_raw_enobufs_total]
    forbidden_metrics: [oie_instance_behavior_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, unavailable_retained, rebaseline, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_complete_snapshot_replaces_retained

  - id: timeout
    description: Netlink receive timeouts invalidate both family dumps until one complete recovery snapshot.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: timeout, failure_cycles: 3}
    expected_metrics: [oie_host_conntrack_raw_ok, oie_host_conntrack_read_errors_total]
    forbidden_metrics: [oie_instance_behavior_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, unavailable_retained, rebaseline, fresh]
