    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: threat_feed_recovery, failure_cycles: 1}
    expected_metrics: [oie_host_threat_feed_fresh, oie_instance_threat_list_severity]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 20, max: 20}
    expected_state_transitions: [source_unavailable, rebaseline, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: first_fresh_source_snapshot_rebaselines_score

