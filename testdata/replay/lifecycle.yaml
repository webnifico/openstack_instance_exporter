schema_version: 1
category: lifecycle
fixtures:
  - id: ipv4_conntrack_failure
    description: IPv4 family collection fails while IPv6 succeeds; the partial snapshot is rejected.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: ipv4_conntrack_failure, failure_cycles: 2}
    expected_metrics: [oie_host_conntrack_raw_ok, oie_host_conntrack_read_errors_total]
    forbidden_metrics: [oie_instance_behavior_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, unavailable_retained, rebaseline, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_complete_snapshot_replaces_retained

  - id: ipv6_conntrack_failure
    description: IPv6 family collection fails while IPv4 succeeds; the partial snapshot is rejected.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: ipv6_conntrack_failure, failure_cycles: 2}
    expected_metrics: [oie_host_conntrack_raw_ok, oie_host_conntrack_last_success_timestamp_seconds]
    forbidden_metrics: [oie_instance_behavior_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, unavailable_retained, rebaseline, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_complete_snapshot_replaces_retained

