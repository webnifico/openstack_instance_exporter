    expected_severity_range: {min: 0, max: 100}
    expected_state_transitions: [fresh, retained_stale, expired_unavailable, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_counter_sample_reestablishes_axis
