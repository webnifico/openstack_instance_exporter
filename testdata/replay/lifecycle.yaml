    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_complete_snapshot_replaces_retained

  - id: libvirt_outage
    description: A complete Libvirt source failure preserves last-good inventory while source health becomes stale.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: libvirt_outage, failure_cycles: 2}
    expected_metrics: [oie_host_libvirt_ok, oie_host_libvirt_last_success_timestamp_seconds, oie_host_libvirt_stale_seconds]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, source_unavailable, retained, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: fresh_cycle_replaces_retained_inventory

  - id: per_domain_libvirt_failure
    description: One domain with missing state freezes only that instance and rebaselines once on recovery.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: per_domain_libvirt_failure, failure_cycles: 2}
    expected_metrics: [oie_host_libvirt_ok, oie_instance_behavior_severity]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, instance_frozen, rebaseline, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: one_fresh_sample_rebaselines_instance

  - id: counter_reset
    description: A decreasing lifetime counter is unavailable for one interval and establishes a new baseline.
    input_observations: {engine: lifecycle, cycles: 4, interval_seconds: 15, event: counter_reset}
    expected_metrics: [oie_instance_resource_axis_available, oie_instance_resource_axis_fresh]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, sample_unavailable, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: next_monotonic_sample_recovers

  - id: live_migration
    description: A destination QEMU identity creates a new runtime generation without inheriting source baselines.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: live_migration}
    expected_metrics: [oie_instance_info, oie_instance_resource_axis_available]
    forbidden_metrics: [oie_instance_threat_list_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, identity_reset, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: destination_establishes_new_baseline

  - id: cold_migration
    description: A stop and new destination runtime reset episode state before new samples become eligible.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: cold_migration}
    expected_metrics: [oie_instance_info, oie_instance_resource_axis_available]
    forbidden_metrics: [oie_instance_threat_list_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, stopped_reset, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: restart_establishes_new_baseline

  - id: instance_reboot
    description: A changed process token and rolled-back lifetime CPU counter identify a rebooted runtime.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: instance_reboot}
    expected_metrics: [oie_instance_info, oie_instance_resource_axis_available]
    forbidden_metrics: [oie_instance_threat_list_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, runtime_reset, fresh]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: reboot_establishes_new_baseline

  - id: instance_shutdown
    description: An authoritative non-running state ends current behavior and mining episodes.
    input_observations: {engine: lifecycle, cycles: 2, interval_seconds: 15, event: instance_shutdown}
    expected_metrics: [oie_instance_state_code]
    forbidden_metrics: [oie_instance_behavior_severity]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, stopped_reset]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: running_state_requires_new_baseline

  - id: instance_deletion
    description: Removing an instance deletes all UUID-scoped transient evidence and inventory membership.
    input_observations: {engine: lifecycle, cycles: 2, interval_seconds: 15, event: instance_deletion}
    expected_metrics: [oie_host_libvirt_active_vms]
    forbidden_metrics: [oie_instance_state_code]
    expected_severity_range: {min: 0, max: 0}
    expected_state_transitions: [fresh, deleted]
    expected_alert: none
    forbidden_alerts: [default_warning_security]
    maximum_expected_detection_delay_seconds: 0
    expected_recovery_behavior: all_instance_state_removed

  - id: ip_reuse
    description: Reassigning one fixed address to a new UUID cannot transfer prior owner evidence.
    input_observations: {engine: lifecycle, cycles: 3, interval_seconds: 15, event: ip_reuse}
