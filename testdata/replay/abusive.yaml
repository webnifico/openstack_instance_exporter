schema_version: 1
category: abusive
fixtures:
  - id: horizontal_scan
    description: Unreplied outbound attempts across many remotes on one destination port.
    input_observations: {engine: behavior, direction: outbound, cycles: 3, interval_seconds: 15, flows: 80, unique_remotes: 80, new_remotes: 80, unique_dst_ports: 1, new_dst_ports: 1, max_single_remote: 1, max_single_dst_port: 80, top_dst_port: 443, unreplied_ratio: 0.95, tcp_flows: 80, tcp_unreplied_ratio: 0.95, tcp_top_remote_flows: 1, tcp_top_dst_port_flows: 80}
    expected_metrics: [oie_instance_outbound_flows, oie_instance_outbound_unique_remotes, oie_instance_behavior_severity]
    forbidden_metrics: [oie_instance_mining_suspected]
    expected_severity_range: {min: 25, max: 60}
    expected_state_transitions: [candidate, alerted]
    expected_alert: outbound_horizontal_scan_suspected
    forbidden_alerts: [unrelated_security_alert]
    maximum_expected_detection_delay_seconds: 30
    expected_recovery_behavior: clean_cycle_resets_state

