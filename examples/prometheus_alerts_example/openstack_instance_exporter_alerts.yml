# OIE alerts: edit expr, for and severity below. No Jinja or inventory flags.
# Remove/comment a whole alert to disable it; dashboards remain independent.
# Edit expr to tune conditions; keep its short description consistent.
# Shared calculations are at the end. The standard role renders them BEFORE
# the alerts in one evaluation group, so dependencies use the same timestamp.
#
# Shared defaults (edit the named calculation at the end):
#   oie:activity:unusual       >3x historical p95 AND >3 standard deviations above it
#   oie:disk:latency_impact    read >150ms / write >100ms / flush >40ms; >=60 operations
#   oie:network:packet_impact  drops/errors >2%; >=1000 observations, >=20 affected
#   oie:network:pressure      VM packet impact OR host conntrack usage >=80%
# History: previous day excluding the latest hour; >=72 usable 5m samples.
# Missing or stale measurements do not become zero. Optional feeds must be enabled.
prometheus_alert_rules:
  - group_name: OpenStack Instance Exporter
    group_exporter_job: openstack-instance-exporter
    group_plain_expressions: true
    group_rules:

      # VM CPU and memory
      - alert: OpenStackInstanceHighCPUUsage
        expr: |-
          (
            (oie:activity:unusual{signal="cpu_percent"} >= 20)
            or (oie:activity:recent{signal="cpu_percent"} >= 95)
          )
          and on (job, instance, instance_uuid) (oie:cpu:steal_ratio > 0.05)
        for: 30m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "High CPU with scheduler contention — {{ $labels.server_name }}"
          description: >-
            CPU {{ printf "%.3g" $value }}% with vCPU scheduler waiting >5%. CPU is unusual and >=20%, or >=95%. Check
            host contention and expected workload. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceHighStealRate
        expr: |-
          oie:cpu:steal_ratio > 0.05
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="cpu"}
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "vCPU scheduler delay — {{ $labels.server_name }}"
          description: >-
            vCPU {{ $labels.vcpu }} scheduler waiting {{ $value | humanizePercentage }}; limit 5% over five minutes. Check
            host CPU and VM placement. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceHighMemorySwapInRate
        expr: |-
          oie:memory:swap_in_bytes_per_second > 67108864
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="mem"}
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Heavy guest swap-in — {{ $labels.server_name }}"
          description: >-
            Guest swap-in {{ printf "%.3g" $value }} B/s; limit 64 MiB/s over five minutes. Check guest memory pressure.
            VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceHighMajorFaultRate
        expr: |-
          (
            oie:activity:recent{signal="major_faults_per_second"} >= 200
            and (
              (
                oie:activity:recent{signal="major_faults_per_second"} > oie:activity:baseline{signal="major_faults_per_second"} * 3
                and (oie:activity:increase{signal="major_faults_per_second"} >= 200)
              )
              or (oie:activity:recent{signal="major_faults_per_second"} >= 2000)
            )
          )
          and on (job, instance, instance_uuid) (oie:memory:swap_in_bytes_per_second > 1048576)
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Major faults with guest paging — {{ $labels.server_name }}"
          description: >-
            Major faults {{ printf "%.3g" $value }}/s with guest swap-in >1 MiB/s. Check guest paging and memory pressure.
            VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.


      # VM disks
      - alert: OpenStackInstanceHighDiskIOPSLocal
        expr: |-
          oie:activity:unusual{signal="disk_iops",disk_type="local"} >= 100
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk IOPS with latency — {{ $labels.server_name }}"
          description: >-
            Combined disk IOPS {{ printf "%.3g" $value }} is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceHighDiskIOPSVolumes
        expr: |-
          oie:activity:unusual{signal="disk_iops",disk_type="volumes"} >= 100
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk IOPS with latency — {{ $labels.server_name }}"
          description: >-
            Combined disk IOPS {{ printf "%.3g" $value }} is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceHighDiskIOPSPremium
        expr: |-
          oie:activity:unusual{signal="disk_iops",disk_type="premium"} >= 100
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk IOPS with latency — {{ $labels.server_name }}"
          description: >-
            Combined disk IOPS {{ printf "%.3g" $value }} is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceHighDiskIOPSUltra
        expr: |-
          oie:activity:unusual{signal="disk_iops",disk_type="ultra"} >= 100
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk IOPS with latency — {{ $labels.server_name }}"
          description: >-
            Combined disk IOPS {{ printf "%.3g" $value }} is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceHighDiskIOPSOther
        expr: |-
          oie:activity:unusual{signal="disk_iops",disk_type!~"local|volumes|premium|ultra"} >= 100
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk IOPS with latency — {{ $labels.server_name }}"
          description: >-
            Combined disk IOPS {{ printf "%.3g" $value }} is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceHighDiskThroughput
        expr: |-
          oie:activity:unusual{signal="disk_bytes_per_second"} >= 1048576
          and on (job, instance, instance_uuid, disk_path) oie:disk:latency_impact
        for: 30m
        labels:
          severity: warning
          type: consumption
        annotations:
          summary: "Unusual disk throughput with latency — {{ $labels.server_name }}"
          description: >-
            Disk throughput {{ printf "%.3g" $value }} B/s is unusually high, with latency on the same disk. Check volume
            workload and storage latency. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceDiskReadLatencyHigh
        expr: oie:disk:read_latency_seconds > 0.15
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Read latency high — {{ $labels.server_name }} / {{ $labels.disk_path }}"
          description: >-
            Mean read latency {{ $value | humanizeDuration }}; limit 150 ms with >=60 operations in five minutes. Check
            other volumes and storage backend; this identifies slow I/O, not its cause. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk:
            {{ $labels.disk_path }}; volume: {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceDiskWriteLatencyHigh
        expr: oie:disk:write_latency_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Write latency high — {{ $labels.server_name }} / {{ $labels.disk_path }}"
          description: >-
            Mean write latency {{ $value | humanizeDuration }}; limit 100 ms with >=60 operations in five minutes. Check
            other volumes and storage backend; this identifies slow I/O, not its cause. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk:
            {{ $labels.disk_path }}; volume: {{ $labels.volume_uuid }}.

      - alert: OpenStackInstanceDiskFlushLatencyHigh
        expr: oie:disk:flush_latency_seconds > 0.04
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Flush latency high — {{ $labels.server_name }} / {{ $labels.disk_path }}"
          description: >-
            Mean flush latency {{ $value | humanizeDuration }}; limit 40 ms with >=60 operations in five minutes. Check
            other volumes and storage backend; this identifies slow I/O, not its cause. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk:
            {{ $labels.disk_path }}; volume: {{ $labels.volume_uuid }}.


      # VM network interfaces
      - alert: OpenStackInstanceHighIncomingPacketRate
        expr: |-
          oie:activity:unusual{signal="rx_packets_per_second"} >= 100
          and on (job, instance, instance_uuid, ifname) oie:network:packet_impact
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Unusual traffic with packet loss or errors — {{ $labels.server_name }}"
          description: >-
            RX {{ printf "%.3g" $value }} packets/s is unusually high, with drops/errors on the same interface. History
            required. Check traffic and interface counters. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceHighBandwidthRateRX
        expr: |-
          oie:activity:unusual{signal="rx_bytes_per_second"} >= 1048576
          and on (job, instance, instance_uuid, ifname) oie:network:packet_impact
        for: 30m
        labels:
          severity: info
          type: consumption
        annotations:
          summary: "Unusual traffic with packet loss or errors — {{ $labels.server_name }}"
          description: >-
            RX {{ printf "%.3g" $value }} B/s is unusually high, with drops/errors on the same interface. History
            required. Check traffic and interface counters. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceNetworkReceiveDropRatioHigh
        expr: oie:network:rx_drop_ratio > 0.02
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Receive packet drops — {{ $labels.server_name }}"
          description: >-
            RX drops {{ $value | humanizePercentage }}; limit 2%, with >=1000 observations and >=20 affected packets in
            five minutes. Check interface counters and host networking. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceNetworkReceiveErrorRatioHigh
        expr: oie:network:rx_error_ratio > 0.02
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Receive interface errors — {{ $labels.server_name }}"
          description: >-
            RX errors {{ $value | humanizePercentage }}; limit 2%, with >=1000 observations and >=20 affected packets in
            five minutes. Check interface counters and host networking. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceHighOutgoingPacketRate
        expr: |-
          oie:activity:unusual{signal="tx_packets_per_second"} >= 100
          and on (job, instance, instance_uuid, ifname) oie:network:packet_impact
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Unusual traffic with packet loss or errors — {{ $labels.server_name }}"
          description: >-
            TX {{ printf "%.3g" $value }} packets/s is unusually high, with drops/errors on the same interface. History
            required. Check traffic and interface counters. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceHighBandwidthRateTX
        expr: |-
          oie:activity:unusual{signal="tx_bytes_per_second"} >= 1048576
          and on (job, instance, instance_uuid, ifname) oie:network:packet_impact
        for: 30m
        labels:
          severity: info
          type: consumption
        annotations:
          summary: "Unusual traffic with packet loss or errors — {{ $labels.server_name }}"
          description: >-
            TX {{ printf "%.3g" $value }} B/s is unusually high, with drops/errors on the same interface. History
            required. Check traffic and interface counters. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceNetworkTransmitDropRatioHigh
        expr: oie:network:tx_drop_ratio > 0.02
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Transmit packet drops — {{ $labels.server_name }}"
          description: >-
            TX drops {{ $value | humanizePercentage }}; limit 2%, with >=1000 observations and >=20 affected packets in
            five minutes. Check interface counters and host networking. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.

      - alert: OpenStackInstanceNetworkTransmitErrorRatioHigh
        expr: oie:network:tx_error_ratio > 0.02
        for: 5m
        labels:
          severity: warning
          type: impact
        annotations:
          summary: "Transmit interface errors — {{ $labels.server_name }}"
          description: >-
            TX errors {{ $value | humanizePercentage }}; limit 2%, with >=1000 observations and >=20 affected packets in
            five minutes. Check interface counters and host networking. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Interface:
            {{ $labels.ifname }}.


      # Connections and traffic patterns
      - alert: OpenStackInstanceConntrackFlowsBurst
        expr: |-
          oie:activity:unusual{signal="conntrack_flows"} >= 100
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Connection surge with network pressure — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} tracked flows: unusual growth with packet problems or host conntrack pressure.
            Check connection pools and traffic. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceHighConntrackFlowsSustained
        expr: |-
          oie:activity:unusual{signal="conntrack_flows"} >= 100
          and on (job, instance) (oie_host_conntrack_utilization{job="openstack-instance-exporter"} >= 0.8)
        for: 30m
        labels:
          severity: info
          type: consumption
        annotations:
          summary: "Sustained connection occupancy — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} tracked flows: unusually high while host conntrack usage is >=80%. Check connection
            pools and host conntrack capacity. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstancePossibleFlood
        expr: |-
          oie:activity:fast{signal="conntrack_flows"} >= 20000
          and on (job, instance, instance_uuid) oie:network:packet_impact
        for: 2m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Possible flood with packet loss or errors — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} tracked flows over two minutes with packet drops/errors. Check traffic and affected
            interfaces; this is a possible flood. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceOutboundPortScanBurst
        expr: |-
          (
            oie_instance_outbound_unique_dst_ports{job="openstack-instance-exporter"} > 200
            and (oie_instance_outbound_unique_remotes{job="openstack-instance-exporter"} > 25)
            and (oie_instance_outbound_flows{job="openstack-instance-exporter"} > 5000)
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Outbound scanning-like activity — {{ $labels.server_name }}"
          description: >-
            Outbound {{ printf "%.3g" $value }} destination ports across many remotes, with packet problems or host
            conntrack pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP:
            {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceOutboundSingleTargetFlood
        expr: |-
          (
            oie_instance_outbound_max_flows_single_remote{job="openstack-instance-exporter"} > 25000
            and (oie_instance_outbound_max_flows_single_remote{job="openstack-instance-exporter"} / clamp_min(oie_instance_outbound_flows{job="openstack-instance-exporter"}, 1) >= 0.9)
            and on (job, instance, instance_uuid, ip, family) (
              (oie:activity:fast_ratio{signal="conntrack_flows"} > 3)
              or (oie_instance_outbound_max_flows_single_remote{job="openstack-instance-exporter"} > 100000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 2m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Possible outbound concentrated flood — {{ $labels.server_name }}"
          description: >-
            Outbound {{ printf "%.3g" $value }} flows concentrated on one destination, with packet problems or host
            conntrack pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP:
            {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceOutboundSprayOnSinglePort
        expr: |-
          (
            oie_instance_outbound_unique_remotes{job="openstack-instance-exporter"} > 300
            and (oie_instance_outbound_unique_dst_ports{job="openstack-instance-exporter"} <= 3)
            and (oie_instance_outbound_flows{job="openstack-instance-exporter"} > 5000)
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Outbound narrow-port fan-out — {{ $labels.server_name }}"
          description: >-
            Outbound {{ printf "%.3g" $value }} remotes across at most three destination ports, with packet problems or
            host conntrack pressure. Check traffic, workload intent and affected endpoints. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}. IP: {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceOutboundExtremeRemoteFanout
        expr: |-
          (
            oie:activity:recent{signal="outbound_remotes"} >= 1500
            and (
              (
                oie:activity:recent{signal="outbound_remotes"} > oie:activity:baseline{signal="outbound_remotes"} * 3
                and (oie:activity:increase{signal="outbound_remotes"} >= 500)
              )
              or (oie:activity:recent{signal="outbound_remotes"} >= 10000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Outbound remote breadth increased — {{ $labels.server_name }}"
          description: >-
            Outbound {{ printf "%.3g" $value }} remote addresses, with packet problems or host conntrack pressure. Check
            traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }}
            ({{ $labels.family }}).

      - alert: OpenStackInstanceOutboundZombieFlowLowThroughput
        expr: |-
          (
            oie_instance_outbound_flows{job="openstack-instance-exporter"} >= 5000
            and (oie_instance_outbound_bytes_per_flow{job="openstack-instance-exporter"} < 1024)
            and (oie_instance_outbound_packets_per_flow{job="openstack-instance-exporter"} < 10)
            and on (job, instance, instance_uuid, ip, family) (
              (oie:activity:ratio{signal="conntrack_flows"} > 3)
              or (oie:activity:recent{signal="conntrack_flows"} >= 50000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 30m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Large low-activity outbound flow population — {{ $labels.server_name }}"
          description: >-
            Outbound {{ printf "%.3g" $value }} flows with little data per flow, with packet problems or host conntrack
            pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }}
            ({{ $labels.family }}).

      - alert: OpenStackInstanceInboundPortScanBurst
        expr: |-
          (
            oie_instance_inbound_unique_dst_ports{job="openstack-instance-exporter"} > 200
            and (oie_instance_inbound_unique_remotes{job="openstack-instance-exporter"} > 25)
            and (oie_instance_inbound_flows{job="openstack-instance-exporter"} > 5000)
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Inbound scanning-like activity — {{ $labels.server_name }}"
          description: >-
            Inbound {{ printf "%.3g" $value }} destination ports across many remotes, with packet problems or host
            conntrack pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}.
            Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP:
            {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceInboundSingleSourceFlood
        expr: |-
          (
            oie_instance_inbound_max_flows_single_remote{job="openstack-instance-exporter"} > 25000
            and (oie_instance_inbound_max_flows_single_remote{job="openstack-instance-exporter"} / clamp_min(oie_instance_inbound_flows{job="openstack-instance-exporter"}, 1) >= 0.9)
            and on (job, instance, instance_uuid, ip, family) (
              (oie:activity:fast_ratio{signal="conntrack_flows"} > 3)
              or (oie_instance_inbound_max_flows_single_remote{job="openstack-instance-exporter"} > 100000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 2m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Possible inbound concentrated flood — {{ $labels.server_name }}"
          description: >-
            Inbound {{ printf "%.3g" $value }} flows concentrated on one source, with packet problems or host conntrack
            pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }}
            ({{ $labels.family }}).

      - alert: OpenStackInstanceInboundSprayOnSinglePort
        expr: |-
          (
            oie_instance_inbound_unique_remotes{job="openstack-instance-exporter"} > 300
            and (oie_instance_inbound_unique_dst_ports{job="openstack-instance-exporter"} <= 3)
            and (oie_instance_inbound_flows{job="openstack-instance-exporter"} > 5000)
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Inbound narrow-port fan-out — {{ $labels.server_name }}"
          description: >-
            Inbound {{ printf "%.3g" $value }} remotes across at most three destination ports, with packet problems or
            host conntrack pressure. Check traffic, workload intent and affected endpoints. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}. IP: {{ $labels.ip }} ({{ $labels.family }}).

      - alert: OpenStackInstanceInboundExtremeRemoteFanout
        expr: |-
          (
            oie:activity:recent{signal="inbound_remotes"} >= 1500
            and (
              (
                oie:activity:recent{signal="inbound_remotes"} > oie:activity:baseline{signal="inbound_remotes"} * 3
                and (oie:activity:increase{signal="inbound_remotes"} >= 500)
              )
              or (oie:activity:recent{signal="inbound_remotes"} >= 10000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 15m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Inbound remote breadth increased — {{ $labels.server_name }}"
          description: >-
            Inbound {{ printf "%.3g" $value }} remote addresses, with packet problems or host conntrack pressure. Check
            traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }}
            ({{ $labels.family }}).

      - alert: OpenStackInstanceInboundZombieFlowLowThroughput
        expr: |-
          (
            oie_instance_inbound_flows{job="openstack-instance-exporter"} >= 5000
            and (oie_instance_inbound_bytes_per_flow{job="openstack-instance-exporter"} < 1024)
            and (oie_instance_inbound_packets_per_flow{job="openstack-instance-exporter"} < 10)
            and on (job, instance, instance_uuid, ip, family) (
              (oie:activity:ratio{signal="conntrack_flows"} > 3)
              or (oie:activity:recent{signal="conntrack_flows"} >= 50000)
            )
          )
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 30m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Large low-activity inbound flow population — {{ $labels.server_name }}"
          description: >-
            Inbound {{ printf "%.3g" $value }} flows with little data per flow, with packet problems or host conntrack
            pressure. Check traffic, workload intent and affected endpoints. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. IP: {{ $labels.ip }}
            ({{ $labels.family }}).


      # Threat-list contacts and mining evidence
      - alert: OpenStackInstanceTorExitRepeatedContact
        expr: |-
          oie_instance_threat_tor_exit_active_flows{direction=~"out|any",job="openstack-instance-exporter"} > 0
          and on (job, instance) (oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="TOREXIT"} == 1)
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 30m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Persistent TorExit list match — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} active flow matches against Tor exit. Packet problems or host conntrack pressure
            also qualify. Check destination and authorized workload; a list match does not prove compromise. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceTorRelayRepeatedContact
        expr: |-
          oie_instance_threat_tor_relay_active_flows{direction=~"out|any",job="openstack-instance-exporter"} > 0
          and on (job, instance) (oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="TORRELAY"} == 1)
          and on (job, instance, instance_uuid) oie:network:pressure
        for: 30m
        labels:
          severity: info
          type: suspicious
        annotations:
          summary: "Persistent TorRelay list match — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} active flow matches against Tor relay. Packet problems or host conntrack pressure
            also qualify. Check destination and authorized workload; a list match does not prove compromise. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceSpamhausRepeatedContact
        expr: |-
          (
            oie_instance_threat_spamhaus_active_flows{job="openstack-instance-exporter",direction="out"} > 0
            or (
              oie_instance_threat_spamhaus_active_flows{job="openstack-instance-exporter",direction="any"} > 0
              and on (job, instance, instance_uuid) oie:network:pressure
            )
          )
          and on (job, instance, instance_uuid) oie:network_current
          and on (job, instance) (oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="spamhaus"} == 1)
        for: 10m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Persistent Spamhaus list match — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} active flow matches against Spamhaus. Undirected matches also require network
            pressure. Check destination and authorized workload; a list match does not prove compromise. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceEmergingThreatsRepeatedContact
        expr: |-
          (
            oie_instance_threat_emergingthreats_active_flows{job="openstack-instance-exporter",direction="out"} > 0
            or (
              oie_instance_threat_emergingthreats_active_flows{job="openstack-instance-exporter",direction="any"} > 0
              and on (job, instance, instance_uuid) oie:network:pressure
            )
          )
          and on (job, instance, instance_uuid) oie:network_current
          and on (job, instance) (oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="EMERGING"} == 1)
        for: 10m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Persistent EmergingThreats list match — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} active flow matches against Emerging Threats. Undirected matches also require
            network pressure. Check destination and authorized workload; a list match does not prove compromise. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceCustomListRepeatedContact
        expr: |-
          (
            oie_instance_threat_customlist_active_flows{job="openstack-instance-exporter",direction="out"} > 0
            or (
              oie_instance_threat_customlist_active_flows{job="openstack-instance-exporter",direction="any"} > 0
              and on (job, instance, instance_uuid) oie:network:pressure
            )
          )
          and on (job, instance, instance_uuid) oie:network_current
          and on (job, instance) (oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="CUSTOMLIST"} == 1)
        for: 15m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Persistent CustomList list match — {{ $labels.server_name }}"
          description: >-
            {{ printf "%.3g" $value }} active flow matches against custom list. Undirected matches also require network
            pressure. Check destination and authorized workload; a list match does not prove compromise. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceMiningSuspected
        expr: oie:mining_warning == 1
        for: 15m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Persistent mining-like evidence — {{ $labels.server_name }}"
          description: >-
            Qualified mining-like evidence (state {{ printf "%.3g" $value }}); shared-port evidence also meets its CPU
            requirement. Check endpoint evidence and authorized workload; this does not confirm mining. VM:
            {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceMiningCandidatePersistent
        expr: |-
          max by (job, instance, domain, server_name, instance_uuid, project_uuid, project_name, user_uuid)(oie_instance_mining_suspected{confidence="high_persistent",job="openstack-instance-exporter"} == 1)
          and on (job, instance, instance_uuid) (oie:cpu_percent_5m >= 40)
          and on (job, instance, instance_uuid) oie:network_current
          unless on (job, instance, instance_uuid) oie:mining_warning
        for: 30m
        labels:
          severity: info
          type: activity
        annotations:
          summary: "Persistent mining candidate with CPU corroboration — {{ $labels.server_name }}"
          description: >-
            Persistent dedicated-port mining candidate (state {{ printf "%.3g" $value }}) with CPU >=40%. Check endpoint
            evidence and authorized workload; this does not confirm mining. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}.


      # Volume retypes
      - alert: OpenStackInstanceVolumeRetypeReadyStalled
        expr: |-
          oie_instance_disk_retype_status_code{job="openstack-instance-exporter"} == 6
          and on (job, instance) oie:libvirt_ready
        for: 1m
        labels:
          severity: warning
          type: operation
        annotations:
          summary: "Volume copy awaiting pivot — {{ $labels.server_name }} / {{ $labels.disk_path }}"
          description: >-
            Copy has waited >=10m for pivot (state {{ printf "%.3g" $value }}). Check Nova/Cinder logs and the block job;
            this is a compute-local observation. VM: {{ $labels.instance_uuid }}. Project: {{ $labels.project_name }}
            ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk: {{ $labels.disk_path }}; volume:
            {{ $labels.volume_uuid }}. Destination: {{ $labels.destination_volume_uuid }}.

      - alert: OpenStackInstanceVolumeRetypeObservationUnhealthy
        expr: |-
          oie_instance_disk_retype_observation_healthy{job="openstack-instance-exporter"} == 0
          and on (job, instance) oie:libvirt_ready
        for: 2m
        labels:
          severity: warning
          type: operation
        annotations:
          summary: "Volume block-job observation unavailable — {{ $labels.server_name }}"
          description: >-
            Block-job observation failed (state {{ printf "%.3g" $value }}) while Libvirt is healthy. Check block-job RPC
            logs; missing observations do not prove a stall or completion. VM: {{ $labels.instance_uuid }}. Project:
            {{ $labels.project_name }} ({{ $labels.project_uuid }}). Host: {{ $labels.instance }}. Disk:
            {{ $labels.disk_path }}; volume: {{ $labels.volume_uuid }}. Destination:
            {{ $labels.destination_volume_uuid }}.


      # Exporter and host health
      - alert: OpenStackInstanceExporterUnavailable
        expr: up{job="openstack-instance-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Exporter unavailable — {{ $labels.instance }}"
          description: >-
            Exporter scrape failed (up={{ printf "%.3g" $value }}). Check exporter service and scrape connectivity. Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterProcessCPUHigh
        expr: |-
          rate(process_cpu_seconds_total{job="openstack-instance-exporter"}[5m]) > 0.5
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (oie_host_collection_cycle_duration_seconds{job="openstack-instance-exporter"} / oie_host_collection_interval_seconds{job="openstack-instance-exporter"} >= 0.8)
        for: 15m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Exporter CPU budget exceeded — {{ $labels.instance }}"
          description: >-
            Exporter CPU {{ printf "%.3g" $value }} cores exceeds 0.5 and collection uses >=80% of its interval. Check
            collection durations and instance/flow counts. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostThreatListed
        expr: |-
          oie_host_threat_provider_ip_listed{job="openstack-instance-exporter",list=~"spamhaus|EMERGING|CUSTOMLIST"} > 0
          and on (job, instance, list) (oie_host_threat_feed_fresh{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 15m
        labels:
          severity: warning
          type: suspicious
        annotations:
          summary: "Provider-owned IP listed — {{ $labels.ip }}"
          description: >-
            Provider IP {{ $labels.ip }} matches {{ $labels.list }} (state {{ printf "%.3g" $value }}). Check IP ownership
            and the list entry. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostConntrackUtilizationHigh
        expr: |-
          oie_host_conntrack_utilization{job="openstack-instance-exporter"} > 0.8
          and on (job, instance) oie:conntrack_ready
        for: 5m
        labels:
          severity: warning
          type: capacity
        annotations:
          summary: "Host conntrack pressure — {{ $labels.instance }}"
          description: >-
            Host conntrack usage {{ $value | humanizePercentage }}; limit 80%. Check connection pools and top contributing
            instances. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterCollectionCycleNearInterval
        expr: |-
          oie_host_collection_cycle_duration_seconds{job="openstack-instance-exporter"} / clamp_min(oie_host_collection_interval_seconds{job="openstack-instance-exporter"}, 1) >= 0.8
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 10m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Collection timing headroom low — {{ $labels.instance }}"
          description: >-
            Collection uses {{ $value | humanizePercentage }} of its interval; limit 80%. Check Libvirt and conntrack
            collection durations. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostCPUPressureSustained
        expr: |-
          oie_host_cpu_usage_percent{job="openstack-instance-exporter"} > 95
          and on (job, instance) oie:libvirt_ready
        for: 15m
        labels:
          severity: warning
          type: capacity
        annotations:
          summary: "Host CPU headroom low — {{ $labels.instance }}"
          description: >-
            Host CPU {{ printf "%.3g" $value }}%; limit 95%, excluding idle and I/O wait. Check workload placement and
            guest scheduler delay. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostMemoryPressureSustained
        expr: |-
          oie_host_mem_available_mib{job="openstack-instance-exporter"} / oie_host_mem_mib_total{job="openstack-instance-exporter"} < 0.05
          and on (job, instance) oie:libvirt_ready
        for: 15m
        labels:
          severity: warning
          type: capacity
        annotations:
          summary: "Host memory headroom low — {{ $labels.instance }}"
          description: >-
            Available host memory {{ $value | humanizePercentage }}; minimum 5%. Check resident memory, allocations and
            guest paging. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostConntrackReadErrors
        expr: |-
          increase(oie_host_conntrack_read_errors_total{job="openstack-instance-exporter"}[10m]) > 5
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 0s
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Repeated conntrack read errors — {{ $labels.instance }}"
          description: >-
            {{ printf "%.3g" $value }} conntrack read errors in ten minutes; limit 5. Check timeout, ENOBUFS and
            parse-error logs. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterConntrackRawReaderFailed
        expr: |-
          oie_host_conntrack_raw_ok{job="openstack-instance-exporter"} == 0
          and on (job, instance) oie:libvirt_ready
        for: 2m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Conntrack collection failed/incomplete — {{ $labels.instance }}"
          description: >-
            Conntrack reader failed (state {{ printf "%.3g" $value }}) while Libvirt is healthy. Check conntrack
            collection logs. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterConntrackReadStale
        expr: |-
          time() - oie_host_conntrack_last_success_timestamp_seconds{job="openstack-instance-exporter"} > clamp_min(3 * oie_host_collection_interval_seconds{job="openstack-instance-exporter"}, 120)
          and on (job, instance) (oie_host_conntrack_raw_ok{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 2m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Conntrack observations stale — {{ $labels.instance }}"
          description: >-
            Last successful conntrack read was {{ $value | humanizeDuration }} ago; limit is max(2m, three collection
            intervals). Check stalled collection. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterLibvirtDataStale
        expr: |-
          time() - oie_host_libvirt_last_success_timestamp_seconds{job="openstack-instance-exporter"} > clamp_min(3 * oie_host_collection_interval_seconds{job="openstack-instance-exporter"}, 240)
          and on (job, instance) (oie_host_libvirt_ok{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 2m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Libvirt observations stale — {{ $labels.instance }}"
          description: >-
            Last successful Libvirt read was {{ $value | humanizeDuration }} ago; limit is max(4m, three collection
            intervals). Check stalled collection. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterLibvirtCollectionUnhealthy
        expr: |-
          oie_host_libvirt_ok{job="openstack-instance-exporter"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 2m
        labels:
          severity: warning
          type: collection
        annotations:
          summary: "Libvirt collection unhealthy — {{ $labels.instance }}"
          description: >-
            Libvirt collection failed (state {{ printf "%.3g" $value }}); retained resource values are not current. Check
            Libvirt connectivity and collection logs. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostCPUContentionCritical
        expr: oie:host_cpu_impact
        for: 5m
        labels:
          severity: critical
          type: impact
        annotations:
          summary: "Host CPU contention — {{ $labels.instance }}"
          description: >-
            Host CPU {{ printf "%.3g" $value }}% exceeds 95% (excluding idle and I/O wait), with aggregate guest scheduler
            waiting >5% of allocated vCPU time. Check affected guests and workload placement. Host:
            {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterHostMemoryPressureCritical
        expr: oie:host_memory_impact
        for: 5m
        labels:
          severity: critical
          type: impact
        annotations:
          summary: "Very low host memory with guest paging — {{ $labels.instance }}"
          description: >-
            Available host memory {{ $value | humanizePercentage }} is below 2%, with aggregate guest swap-in >1 MiB/s.
            Check host headroom and guest paging. Host: {{ $labels.instance }}.


      # Threat-feed availability
      - alert: OpenStackInstanceExporterTorExitListRefreshStale
        expr: |-
          oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="TOREXIT"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 10m
        labels:
          severity: warning
          type: coverage
        annotations:
          summary: "TOREXIT feed coverage unavailable — {{ $labels.instance }}"
          description: >-
            Enabled Tor exit feed has no usable snapshot (state {{ printf "%.3g" $value }}). Check feed refresh/download
            logs; a failed refresh with a usable snapshot does not qualify. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterTorRelayListRefreshStale
        expr: |-
          oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="TORRELAY"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 10m
        labels:
          severity: warning
          type: coverage
        annotations:
          summary: "TORRELAY feed coverage unavailable — {{ $labels.instance }}"
          description: >-
            Enabled Tor relay feed has no usable snapshot (state {{ printf "%.3g" $value }}). Check feed refresh/download
            logs; a failed refresh with a usable snapshot does not qualify. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterSpamhausListRefreshStale
        expr: |-
          oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="spamhaus"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 30m
        labels:
          severity: warning
          type: coverage
        annotations:
          summary: "spamhaus feed coverage unavailable — {{ $labels.instance }}"
          description: >-
            Enabled Spamhaus feed has no usable snapshot (state {{ printf "%.3g" $value }}). Check feed refresh/download
            logs; a failed refresh with a usable snapshot does not qualify. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterEmergingThreatsListRefreshStale
        expr: |-
          oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="EMERGING"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 30m
        labels:
          severity: warning
          type: coverage
        annotations:
          summary: "EMERGING feed coverage unavailable — {{ $labels.instance }}"
          description: >-
            Enabled Emerging Threats feed has no usable snapshot (state {{ printf "%.3g" $value }}). Check feed
            refresh/download logs; a failed refresh with a usable snapshot does not qualify. Host: {{ $labels.instance }}.

      - alert: OpenStackInstanceExporterCustomListRefreshStale
        expr: |-
          oie_host_threat_feed_fresh{job="openstack-instance-exporter",list="CUSTOMLIST"} == 0
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
        for: 10m
        labels:
          severity: warning
          type: coverage
        annotations:
          summary: "CUSTOMLIST feed coverage unavailable — {{ $labels.instance }}"
          description: >-
            Enabled custom list feed has no usable snapshot (state {{ printf "%.3g" $value }}). Check feed
            refresh/download logs; a failed refresh with a usable snapshot does not qualify. Host: {{ $labels.instance }}.

    # Shared calculations. Keep these when disabling individual alerts.
    # Each definition is evaluated before the next; alerts are rendered last.
    group_recording_rules:

      # Guest swap-in over five minutes; require a current counter sample.
      - record: oie:memory:swap_in_bytes_per_second
        expr: |-
          rate(oie_instance_mem_swap_in_bytes_total{job="openstack-instance-exporter"}[5m])
          and oie_instance_mem_swap_in_bytes_total{job="openstack-instance-exporter"}

      # Per-vCPU scheduler waiting / elapsed time; require a current counter sample.
      - record: oie:cpu:steal_ratio
        expr: |-
          rate(oie_instance_cpu_steal_seconds_total{job="openstack-instance-exporter"}[5m])
          and oie_instance_cpu_steal_seconds_total{job="openstack-instance-exporter"}

      # Source validity: successful, reachable and recent collection.
      - record: oie:libvirt_ready
        expr: |-
          oie_host_libvirt_ok{job="openstack-instance-exporter"} == 1
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (oie_host_libvirt_last_success_timestamp_seconds{job="openstack-instance-exporter"} > 0)
          and on (job, instance) (time() - oie_host_libvirt_last_success_timestamp_seconds{job="openstack-instance-exporter"} >= 0)
          and on (job, instance) (time() - oie_host_libvirt_last_success_timestamp_seconds{job="openstack-instance-exporter"} <= clamp_min(3 * oie_host_collection_interval_seconds{job="openstack-instance-exporter"}, 120))

      - record: oie:conntrack_ready
        expr: |-
          oie_host_conntrack_raw_ok{job="openstack-instance-exporter"} == 1
          and on (job, instance) (up{job="openstack-instance-exporter"} == 1)
          and on (job, instance) (oie_host_conntrack_last_success_timestamp_seconds{job="openstack-instance-exporter"} > 0)
          and on (job, instance) (time() - oie_host_conntrack_last_success_timestamp_seconds{job="openstack-instance-exporter"} >= 0)
          and on (job, instance) (time() - oie_host_conntrack_last_success_timestamp_seconds{job="openstack-instance-exporter"} <= clamp_min(3 * oie_host_collection_interval_seconds{job="openstack-instance-exporter"}, 120))

      - record: oie:instance_running
        expr: |-
          oie_instance_state_code{job="openstack-instance-exporter"} == 1
          and on (job, instance) oie:libvirt_ready

      - record: oie:network_current
        expr: |-
          oie:instance_running
          and on (job, instance) oie:conntrack_ready

      - record: oie:resource_axis_current
        expr: |-
          oie_instance_resource_axis_fresh{job="openstack-instance-exporter"} == 1
          and (oie_instance_resource_axis_available{job="openstack-instance-exporter"} == 1)
          and on (job, instance, instance_uuid) oie:instance_running

      # Current per-resource observations. Preserve disk, interface and IP identity.
      - record: oie:activity:sample
        expr: |-
          (
            label_replace(
              (
                oie_instance_cpu_vcpu_percent{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="cpu"}
              ),
              "signal", "cpu_percent", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                rate(oie_instance_mem_major_faults_total{job="openstack-instance-exporter"}[5m])
                and oie_instance_mem_major_faults_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="mem"}
              ),
              "signal", "major_faults_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                (oie_instance_disk_read_iops{job="openstack-instance-exporter"} + oie_instance_disk_write_iops{job="openstack-instance-exporter"})
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="disk"}
              ),
              "signal", "disk_iops", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                (rate(oie_instance_disk_read_gib_total{job="openstack-instance-exporter"}[5m]) + rate(oie_instance_disk_write_gib_total{job="openstack-instance-exporter"}[5m])) * 1073741824
                and oie_instance_disk_read_gib_total{job="openstack-instance-exporter"}
                and oie_instance_disk_write_gib_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="disk"}
              ),
              "signal", "disk_bytes_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                oie_instance_conntrack_ip_flows{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:network_current
              ),
              "signal", "conntrack_flows", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                rate(oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}[2m])
                and oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}
              ),
              "signal", "rx_packets_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                rate(oie_instance_net_rx_gib_total{job="openstack-instance-exporter"}[2m]) * 1073741824
                and oie_instance_net_rx_gib_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}
              ),
              "signal", "rx_bytes_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                rate(oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}[2m])
                and oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}
              ),
              "signal", "tx_packets_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                rate(oie_instance_net_tx_gib_total{job="openstack-instance-exporter"}[2m]) * 1073741824
                and oie_instance_net_tx_gib_total{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}
              ),
              "signal", "tx_bytes_per_second", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                oie_instance_inbound_unique_remotes{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:network_current
              ),
              "signal", "inbound_remotes", "__name__", ".*"
            )
          )
          or (
            label_replace(
              (
                oie_instance_outbound_unique_remotes{job="openstack-instance-exporter"}
                and on (job, instance, instance_uuid) oie:network_current
              ),
              "signal", "outbound_remotes", "__name__", ".*"
            )
          )

      # Five-minute activity and two-minute flood response windows.
      - record: oie:activity:recent
        expr: |-
          avg_over_time(oie:activity:sample[5m])
          and oie:activity:sample
          and (count_over_time(oie:activity:sample[5m]) >= 3)

      - record: oie:activity:fast
        expr: |-
          avg_over_time(oie:activity:sample[2m])
          and oie:activity:sample
          and (count_over_time(oie:activity:sample[2m]) >= 2)

      # Historical reference: prior day, excluding the latest hour; >=72 samples.
      - record: oie:activity:baseline
        expr: |-
          quantile_over_time(0.95, oie:activity:sample[1d:5m] offset 1h)
          and (count_over_time(oie:activity:sample[1d:5m] offset 1h) >= 72)

      - record: oie:activity:ratio
        expr: oie:activity:recent / clamp_min(oie:activity:baseline, 1)

      - record: oie:activity:increase
        expr: oie:activity:recent - oie:activity:baseline

      - record: oie:activity:fast_ratio
        expr: oie:activity:fast / clamp_min(oie:activity:baseline, 1)

      - record: oie:cpu_percent_5m
        expr: oie:activity:recent{signal="cpu_percent"}

      # Five-minute mean latency; paired current counters and >=60 completed operations.
      - record: oie:disk:read_latency_seconds
        expr: |-
          rate(oie_instance_disk_read_seconds_total{job="openstack-instance-exporter"}[5m]) / rate(oie_instance_disk_read_requests_total{job="openstack-instance-exporter"}[5m])
          and (increase(oie_instance_disk_read_requests_total{job="openstack-instance-exporter"}[5m]) >= 60)
          and oie_instance_disk_read_seconds_total{job="openstack-instance-exporter"}
          and oie_instance_disk_read_requests_total{job="openstack-instance-exporter"}
          and (count_over_time(oie_instance_disk_read_seconds_total{job="openstack-instance-exporter"}[5m]) == count_over_time(oie_instance_disk_read_requests_total{job="openstack-instance-exporter"}[5m]))
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="disk"}

      - record: oie:disk:write_latency_seconds
        expr: |-
          rate(oie_instance_disk_write_seconds_total{job="openstack-instance-exporter"}[5m]) / rate(oie_instance_disk_write_requests_total{job="openstack-instance-exporter"}[5m])
          and (increase(oie_instance_disk_write_requests_total{job="openstack-instance-exporter"}[5m]) >= 60)
          and oie_instance_disk_write_seconds_total{job="openstack-instance-exporter"}
          and oie_instance_disk_write_requests_total{job="openstack-instance-exporter"}
          and (count_over_time(oie_instance_disk_write_seconds_total{job="openstack-instance-exporter"}[5m]) == count_over_time(oie_instance_disk_write_requests_total{job="openstack-instance-exporter"}[5m]))
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="disk"}

      - record: oie:disk:flush_latency_seconds
        expr: |-
          rate(oie_instance_disk_flush_seconds_total{job="openstack-instance-exporter"}[5m]) / rate(oie_instance_disk_flush_requests_total{job="openstack-instance-exporter"}[5m])
          and (increase(oie_instance_disk_flush_requests_total{job="openstack-instance-exporter"}[5m]) >= 60)
          and oie_instance_disk_flush_seconds_total{job="openstack-instance-exporter"}
          and oie_instance_disk_flush_requests_total{job="openstack-instance-exporter"}
          and (count_over_time(oie_instance_disk_flush_seconds_total{job="openstack-instance-exporter"}[5m]) == count_over_time(oie_instance_disk_flush_requests_total{job="openstack-instance-exporter"}[5m]))
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="disk"}

      # Adaptive notification sensitivity. Both unusual-activity checks must pass.
      - record: oie:activity:deviation
        expr: |-
          stddev_over_time(oie:activity:sample[1d:5m] offset 1h)
          and oie:activity:baseline

      - record: oie:activity:unusual
        expr: |-
          oie:activity:recent > 3 * oie:activity:baseline
          and (oie:activity:recent - oie:activity:baseline > 3 * oie:activity:deviation)

      # Five-minute loss/error ratios with minimum packet counts.
      - record: oie:network:rx_drop_ratio
        expr: |-
          increase(oie_instance_net_rx_dropped_total{job="openstack-instance-exporter"}[5m]) / (increase(oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_rx_dropped_total{job="openstack-instance-exporter"}[5m]))
          and (increase(oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_rx_dropped_total{job="openstack-instance-exporter"}[5m]) >= 1000)
          and (increase(oie_instance_net_rx_dropped_total{job="openstack-instance-exporter"}[5m]) >= 20)
          and oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}
          and oie_instance_net_rx_dropped_total{job="openstack-instance-exporter"}
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}

      - record: oie:network:tx_drop_ratio
        expr: |-
          increase(oie_instance_net_tx_dropped_total{job="openstack-instance-exporter"}[5m]) / (increase(oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_tx_dropped_total{job="openstack-instance-exporter"}[5m]))
          and (increase(oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_tx_dropped_total{job="openstack-instance-exporter"}[5m]) >= 1000)
          and (increase(oie_instance_net_tx_dropped_total{job="openstack-instance-exporter"}[5m]) >= 20)
          and oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}
          and oie_instance_net_tx_dropped_total{job="openstack-instance-exporter"}
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}

      - record: oie:network:rx_error_ratio
        expr: |-
          increase(oie_instance_net_rx_errors_total{job="openstack-instance-exporter"}[5m]) / (increase(oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_rx_errors_total{job="openstack-instance-exporter"}[5m]))
          and (increase(oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_rx_errors_total{job="openstack-instance-exporter"}[5m]) >= 1000)
          and (increase(oie_instance_net_rx_errors_total{job="openstack-instance-exporter"}[5m]) >= 20)
          and oie_instance_net_rx_packets_total{job="openstack-instance-exporter"}
          and oie_instance_net_rx_errors_total{job="openstack-instance-exporter"}
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}

      - record: oie:network:tx_error_ratio
        expr: |-
          increase(oie_instance_net_tx_errors_total{job="openstack-instance-exporter"}[5m]) / (increase(oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_tx_errors_total{job="openstack-instance-exporter"}[5m]))
          and (increase(oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}[5m]) + increase(oie_instance_net_tx_errors_total{job="openstack-instance-exporter"}[5m]) >= 1000)
          and (increase(oie_instance_net_tx_errors_total{job="openstack-instance-exporter"}[5m]) >= 20)
          and oie_instance_net_tx_packets_total{job="openstack-instance-exporter"}
          and oie_instance_net_tx_errors_total{job="openstack-instance-exporter"}
          and on (job, instance, instance_uuid) oie:resource_axis_current{axis="net"}

      # Qualified mining evidence; CPU corroboration is required for shared ports.
      - record: oie:mining_warning
        expr: |-
          max by (job, instance, domain, server_name, instance_uuid, project_uuid, project_name, user_uuid)(
            (oie_instance_mining_suspected{confidence="high",job="openstack-instance-exporter"} == 1)
            or (
              oie_instance_mining_suspected{confidence="shared",job="openstack-instance-exporter"} == 1
              and on (job, instance, instance_uuid) (oie:cpu_percent_5m >= 35)
            )
            or (
              oie_instance_mining_suspected{confidence="shared_persistent",job="openstack-instance-exporter"} == 1
              and on (job, instance, instance_uuid) (oie:cpu_percent_5m >= 60)
            )
          )
          and on (job, instance, instance_uuid) oie:network_current

      # Critical host pressure must coincide with measured guest impact.
      - record: oie:host_cpu_impact
        expr: |-
          oie_host_cpu_usage_percent{job="openstack-instance-exporter"} > 95
          and on (job, instance) (sum by (job, instance)(oie:cpu:steal_ratio and on (job, instance, instance_uuid) oie:resource_axis_current{axis="cpu"}) / sum by (job, instance)(oie_instance_cpu_vcpu_count{job="openstack-instance-exporter"} and on (job, instance, instance_uuid) oie:resource_axis_current{axis="cpu"}) > 0.05)
          and on (job, instance) oie:libvirt_ready

      - record: oie:host_memory_impact
        expr: |-
          oie_host_mem_available_mib{job="openstack-instance-exporter"} / oie_host_mem_mib_total{job="openstack-instance-exporter"} < 0.02
          and on (job, instance) (sum by (job, instance)(oie:memory:swap_in_bytes_per_second and on (job, instance, instance_uuid) oie:resource_axis_current{axis="mem"}) > 1048576)
          and on (job, instance) oie:libvirt_ready

      # Shared impact thresholds used by correlated workload alerts.
      - record: oie:disk:latency_impact
        expr: |-
          (oie:disk:read_latency_seconds > 0.15)
          or (oie:disk:write_latency_seconds > 0.1)
          or (oie:disk:flush_latency_seconds > 0.04)

      - record: oie:network:packet_impact
        expr: |-
          (oie:network:rx_drop_ratio > 0.02)
          or (oie:network:tx_drop_ratio > 0.02)
          or (oie:network:rx_error_ratio > 0.02)
          or (oie:network:tx_error_ratio > 0.02)

      - record: oie:network:pressure
        expr: |-
          (
            oie:network_current
            and on (job, instance, instance_uuid) oie:network:packet_impact
          )
          or (
            oie:network_current
            and on (job, instance) (oie_host_conntrack_utilization{job="openstack-instance-exporter"} >= 0.8)
          )
