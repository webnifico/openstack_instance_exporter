# Workload-only diagnostics retain their names and are disabled by default.
# Set enabled: true on a reviewed diagnostic to opt in.
prometheus_alert_rules:
- group_name: OpenStack Instance Exporter
  group_exporter_job: openstack-instance-exporter
  group_recording_rules:
  - record: oie:libvirt_ready
    expr: "(oie_host_libvirt_ok{job=\\\"openstack-instance-exporter\\\"} == 1) and on (job, instance) (up{job=\\\"openstack-instance-exporter\\\"} == 1)\
      \ and (timestamp(oie_host_libvirt_ok{job=\\\"openstack-instance-exporter\\\"}) == on (job, instance) timestamp(up{job=\\\"openstack-instance-exporter\\\
      \"})) and (oie_host_libvirt_stale_seconds{job=\\\"openstack-instance-exporter\\\"} >= 0) and (oie_host_libvirt_stale_seconds{job=\\\"openstack-instance-exporter\\\
      \"} <= clamp_min(3 * oie_host_collection_interval_seconds{job=\\\"openstack-instance-exporter\\\"}, 60))"
  - record: oie:libvirt_ready_5m
    expr: "oie:libvirt_ready and on (job, instance) (min_over_time(oie_host_libvirt_ok{job=\\\"openstack-instance-exporter\\\"}[5m]) == 1) and on (job,\
      \ instance) (min_over_time(up{job=\\\"openstack-instance-exporter\\\"}[5m]) == 1) and on (job, instance) (count_over_time(oie_host_libvirt_ok{job=\\\
      \"openstack-instance-exporter\\\"}[5m]) == count_over_time(up{job=\\\"openstack-instance-exporter\\\"}[5m])) and on (job, instance) (time() - process_start_time_seconds{job=\\\
      \"openstack-instance-exporter\\\"} >= 300)"
  - record: oie:conntrack_ready
    expr: "(oie_host_conntrack_raw_ok{job=\\\"openstack-instance-exporter\\\"} == 1) and on (job, instance) (up{job=\\\"openstack-instance-exporter\\\"\
      } == 1) and (timestamp(oie_host_conntrack_raw_ok{job=\\\"openstack-instance-exporter\\\"}) == on (job, instance) timestamp(up{job=\\\"openstack-instance-exporter\\\
      \"})) and (oie_host_conntrack_stale_seconds{job=\\\"openstack-instance-exporter\\\"} >= 0) and (oie_host_conntrack_stale_seconds{job=\\\"openstack-instance-exporter\\\
      \"} <= clamp_min(3 * oie_host_collection_interval_seconds{job=\\\"openstack-instance-exporter\\\"}, 60))"
  - record: oie:conntrack_ready_5m
    expr: "oie:conntrack_ready and on (job, instance) (min_over_time(oie_host_conntrack_raw_ok{job=\\\"openstack-instance-exporter\\\"}[5m]) == 1) and on\
      \ (job, instance) (min_over_time(up{job=\\\"openstack-instance-exporter\\\"}[5m]) == 1) and on (job, instance) (count_over_time(oie_host_conntrack_raw_ok{job=\\\
      \"openstack-instance-exporter\\\"}[5m]) == count_over_time(up{job=\\\"openstack-instance-exporter\\\"}[5m])) and on (job, instance) (time() - process_start_time_seconds{job=\\\
      \"openstack-instance-exporter\\\"} >= 300)"
  - record: oie:instance_running
    expr: "(oie_instance_state_code{job=\\\"openstack-instance-exporter\\\"} == 1) and on (job, instance) oie:libvirt_ready"
  - record: oie:resource_axis_current
    expr: "(oie_instance_resource_axis_fresh{job=\\\"openstack-instance-exporter\\\"} == 1) and (oie_instance_resource_axis_available{job=\\\"openstack-instance-exporter\\\
      \"} == 1) and on (job, instance) oie:libvirt_ready"
  - record: oie:resource_current
    expr: "(max by (job, instance, domain, instance_uuid, project_uuid, user_uuid) (oie:resource_axis_current) == 1) unless on (job, instance, domain, instance_uuid,\
      \ project_uuid, user_uuid) (max by (job, instance, domain, instance_uuid, project_uuid, user_uuid) ((oie_instance_resource_axis_available{job=\\\"\
      openstack-instance-exporter\\\"} == 1) and (oie_instance_resource_axis_fresh{job=\\\"openstack-instance-exporter\\\"} != 1)))"
  - record: oie:feeds_ready
    expr: "(count by (job, instance) (oie_host_threat_feed_fresh{job=\\\"openstack-instance-exporter\\\"}) == 5) unless on (job, instance) (max by (job,\
      \ instance) (oie_host_threat_feed_fresh{job=\\\"openstack-instance-exporter\\\"} == 0))"
  - record: oie:host_cpu_impact
    expr: "(oie_host_cpu_usage_percent{job=\\\"openstack-instance-exporter\\\"} > 95) and on (job, instance) ((sum by (job, instance) ((rate(oie_instance_cpu_steal_seconds_total{job=\\\
      \"openstack-instance-exporter\\\"}[5m]) and oie_instance_cpu_steal_seconds_total{job=\\\"openstack-instance-exporter\\\"} and on (job, instance, instance_uuid)\
      \ oie:instance_running)) / sum by (job, instance) (oie_instance_cpu_vcpu_count{job=\\\"openstack-instance-exporter\\\"})) > 0.05) and on (job, instance)\
      \ oie:libvirt_ready_5m"
  - record: oie:host_memory_impact
    expr: "((oie_host_mem_available_mb{job=\\\"openstack-instance-exporter\\\"} / oie_host_mem_mb_total{job=\\\"openstack-instance-exporter\\\"}) < 0.02)\
      \ and on (job, instance) (sum by (job, instance) ((rate(oie_instance_mem_swap_in_bytes_total{job=\\\"openstack-instance-exporter\\\"}[5m]) and oie_instance_mem_swap_in_bytes_total{job=\\\
      \"openstack-instance-exporter\\\"} and on (job, instance, instance_uuid) oie:instance_running)) > 1048576) and on (job, instance) oie:libvirt_ready_5m"
  group_rules:
  - alert: OpenStackInstanceExporterUnavailable
    expr: "max by (instance, job) (up{job=\\\"openstack-instance-exporter\\\"}) == 0"
    for: 5m
    labels:
      severity: warning
    annotations:
      description: Prometheus has been unable to scrape this exporter target for five minutes.
      summary: OpenStack Instance Exporter unavailable on {{ $labels.instance }}
      dashboard_path: /d/d92k2mnsf0p4z?var-gvar_oie_hypervisor={{ $labels.instance | reReplaceAll ":[0-9]+$" "" | urlquery }}&from={{ with query "time()
        - 3600" }}{{ first . | value | printf "%.0f" }}000{{ end }}&to={{ with query "time()" }}{{ first . | value | printf "%.0f" }}000{{ end }}
  - alert: OpenStackInstanceAttentionHigh
    expr: "((max by (job, instance, domain, instance_uuid, project_uuid, user_uuid) (oie_instance_attention_severity{job=\\\"openstack-instance-exporter\\\
      \"}) >= 60) and (max by (job, instance, domain, instance_uuid, project_uuid, user_uuid) (oie_instance_attention_severity{job=\\\"openstack-instance-exporter\\\
      \"}) < 85)) and on (job, instance) oie:libvirt_ready_5m and on (job, instance) oie:conntrack_ready_5m and on (job, instance) oie:feeds_ready and on\
      \ (job, instance, instance_uuid) oie:instance_running and on (job, instance, instance_uuid) oie:resource_current"
    for: 5m
    labels:
      severity: info
    annotations:
      description: Optional workload diagnostic. Instance {{ $labels.instance_uuid }} attention severity high (>= 60). High activity or a heuristic score
        can be legitimate; review the measurements and workload context.
      summary: Instance {{ $labels.instance_uuid }} attention severity high (>= 60)
      dashboard_path: /d/i92k2mnsf0p4z?var-gvar_oie_instance_uuid={{ $labels.instance_uuid | urlquery }}&var-gvar_oie_project_uuid={{ $labels.project_uuid
        | urlquery }}&from={{ with query "time() - 3600" }}{{ first . | value | printf "%.0f" }}000{{ end }}&to={{ with query "time()" }}{{ first . | value
        | printf "%.0f" }}000{{ end }}
    enabled: false
  - alert: OpenStackInstanceAttentionSevere
    expr: "(max by (job, instance, domain, instance_uuid, project_uuid, user_uuid) (oie_instance_attention_severity{job=\\\"openstack-instance-exporter\\\
      \"}) >= 85) and on (job, instance) oie:libvirt_ready_5m and on (job, instance) oie:conntrack_ready_5m and on (job, instance) oie:feeds_ready and on\
      \ (job, instance, instance_uuid) oie:instance_running and on (job, instance, instance_uuid) oie:resource_current"
    for: 5m
    labels:
