- name: Installation and Configuration
  tags: install_oie
  when:
    - "'cleanup_oie' not in ansible_run_tags"
    - openstack_instance_exporter_enabled | bool
  block:

    - name: Validate safe openstack_instance_exporter installation paths
      ansible.builtin.assert:
        that:
          - "(openstack_instance_exporter_install_dir | string) == (openstack_instance_exporter_install_dir | string | trim)"
          - "(openstack_instance_exporter_install_dir | string | trim) is match('^/')"
          - "((openstack_instance_exporter_install_dir | string | trim) | regex_replace('/+', '/')) != '/'"
          - "((openstack_instance_exporter_install_dir | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_customlist_path is not defined or (openstack_instance_exporter_customlist_path | string) == (openstack_instance_exporter_customlist_path | string | trim)"
          - "openstack_instance_exporter_customlist_path is not defined or (openstack_instance_exporter_customlist_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_customlist_path is not defined or ((openstack_instance_exporter_customlist_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_customlist_path is not defined or ((openstack_instance_exporter_customlist_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or (openstack_instance_exporter_behavior_ports_config_path | string) == (openstack_instance_exporter_behavior_ports_config_path | string | trim)"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or (openstack_instance_exporter_behavior_ports_config_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or ((openstack_instance_exporter_behavior_ports_config_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or ((openstack_instance_exporter_behavior_ports_config_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or (openstack_instance_exporter_behavior_rules_config_path | string) == (openstack_instance_exporter_behavior_rules_config_path | string | trim)"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or (openstack_instance_exporter_behavior_rules_config_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or ((openstack_instance_exporter_behavior_rules_config_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or ((openstack_instance_exporter_behavior_rules_config_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_log_file_path is not defined or (openstack_instance_exporter_log_file_path | string) == (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or (openstack_instance_exporter_log_file_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_log_file_path is not defined or ((openstack_instance_exporter_log_file_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_log_file_path is not defined or ((openstack_instance_exporter_log_file_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_log_file_path is not defined or '*' not in (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or '?' not in (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or '[' not in (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_profile in (['disabled'] + (openstack_instance_exporter_profile_defaults.keys() | list))"
        fail_msg: "openstack_instance_exporter paths and profile must be valid; paths must be absolute, non-root, and traversal-free, and the log path must not contain glob metacharacters"

    - name: Inspect openstack_instance_exporter file-valued paths before installation changes
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openstack_instance_exporter_customlist_path | default('') }}"
        - "{{ openstack_instance_exporter_behavior_ports_config_path | default('') }}"
        - "{{ openstack_instance_exporter_behavior_rules_config_path | default('') }}"
        - "{{ openstack_instance_exporter_log_file_path | default('') }}"
      when: item | length > 0
      register: oie_install_file_path_stats

    - name: Reject directory-valued openstack_instance_exporter installation paths
      ansible.builtin.assert:
        that:
          - "not (item.stat.isdir | default(false))"
        fail_msg: "openstack_instance_exporter custom, behavior, and log paths must identify files, not directories"
      loop: "{{ oie_install_file_path_stats.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Inspect openstack_instance_exporter installation directory before installation changes
      become: true
      ansible.builtin.stat:
        path: "{{ openstack_instance_exporter_install_dir }}"
        follow: false
      register: oie_install_dir_stat

    - name: Reject an unsafe existing openstack_instance_exporter installation path
      ansible.builtin.assert:
        that:
          - "not (oie_install_dir_stat.stat.exists | default(false)) or ((oie_install_dir_stat.stat.isdir | default(false)) and not (oie_install_dir_stat.stat.islnk | default(false)))"
        fail_msg: "openstack_instance_exporter_install_dir exists but is not a real directory"

    - name: Validate supported openstack_instance_exporter architecture
      ansible.builtin.assert:
        that:
          - openstack_instance_exporter_architecture == 'amd64'
        fail_msg: "openstack_instance_exporter release artifacts support amd64 hosts only"

    - name: Enable nf_conntrack_acct
      become: true
      ansible.posix.sysctl:
        name: net.netfilter.nf_conntrack_acct
        value: "{{ openstack_instance_exporter_nf_conntrack_acct_value }}"
        state: present
        sysctl_set: true
        reload: true
      when: openstack_instance_exporter_nf_conntrack_acct_enable
      notify: Restart openstack_instance_exporter service

    - name: Ensure the openstack_instance_exporter install directory exists
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download openstack_instance_exporter tarball
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/webnifico/openstack_instance_exporter/releases/download/{{ openstack_instance_exporter_version }}/openstack_instance_exporter-{{ openstack_instance_exporter_version }}-linux-{{ openstack_instance_exporter_architecture }}.tar.xz"
        dest: "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter.tar.xz"
        owner: root
        group: root
        mode: '0644'
        checksum: "sha256:{{ openstack_instance_exporter_sha256 }}"
      register: oie_tar_download_result

    - name: Inspect installed openstack_instance_exporter binary
      become: true
      ansible.builtin.stat:
        path: "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter"
        follow: false
      register: oie_installed_binary

    - name: Extract openstack_instance_exporter tarball
      become: true
      ansible.builtin.unarchive:
        src: "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter.tar.xz"
        dest: "{{ openstack_instance_exporter_install_dir }}"
        remote_src: yes
      when: oie_tar_download_result.changed or not ((oie_installed_binary.stat.isreg | default(false)) and (oie_installed_binary.stat.executable | default(false)) and ((oie_installed_binary.stat.size | default(0) | int) > 0))
      notify: Restart openstack_instance_exporter service

    - name: Create systemd service file for openstack_instance_exporter
      become: true
      ansible.builtin.template:
        src: openstack_instance_exporter.service.j2
        dest: /etc/systemd/system/openstack_instance_exporter.service
        owner: root
        group: root
        mode: '0640'
      register: oie_template_result
      notify: Restart openstack_instance_exporter service

    - name: Install openstack_instance_exporter logrotate rules
      become: true
      ansible.builtin.copy:
        dest: /etc/logrotate.d/openstack_instance_exporter
        owner: root
        group: root
        mode: '0644'
        content: "{{ openstack_instance_exporter_logrotate_content }}"
      when: openstack_instance_exporter_log_file_enable | default(false) | bool

    - name: Remove openstack_instance_exporter logrotate rules when file logging is disabled
      become: true
      ansible.builtin.file:
        path: /etc/logrotate.d/openstack_instance_exporter
        state: absent
      when: not (openstack_instance_exporter_log_file_enable | default(false) | bool)

    - name: Write custom IP list from variable
      become: true
      ansible.builtin.copy:
        dest: "{{ openstack_instance_exporter_customlist_path }}"
        content: "{{ openstack_instance_exporter_custom_ip_list | join('\n') ~ '\n' }}"
        owner: root
        group: root
        mode: '0644'
      when:
        - openstack_instance_exporter_customlist_path is defined
        - openstack_instance_exporter_custom_ip_list is defined
        - openstack_instance_exporter_custom_ip_list | length > 0
      notify: Restart openstack_instance_exporter service

    - name: Copy custom IP list file
      become: true
      ansible.builtin.copy:
        src: "{{ openstack_instance_exporter_customlist_src }}"
        dest: "{{ openstack_instance_exporter_customlist_path }}"
        owner: root
        group: root
        mode: '0644'
      when:
        - openstack_instance_exporter_customlist_path is defined
        - openstack_instance_exporter_customlist_src is defined
        - openstack_instance_exporter_custom_ip_list is not defined or openstack_instance_exporter_custom_ip_list | length == 0
      notify: Restart openstack_instance_exporter service

    - name: Render behavior ports configuration from inline YAML
      become: true
      ansible.builtin.copy:
        dest: "{{ openstack_instance_exporter_behavior_ports_config_path }}"
        content: "{{ openstack_instance_exporter_behavior_ports_config_yaml | trim ~ '\n' }}"
        owner: root
        group: root
        mode: '0644'
      when:
        - openstack_instance_exporter_behavior_ports_config_path is defined
        - openstack_instance_exporter_behavior_ports_config_yaml is defined
        - openstack_instance_exporter_behavior_ports_config_yaml | trim | length > 0
      notify: Restart openstack_instance_exporter service

    - name: Remove behavior ports configuration when inline YAML is empty
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_behavior_ports_config_path }}"
        state: absent
      when:
        - openstack_instance_exporter_behavior_ports_config_path is defined
        - openstack_instance_exporter_behavior_ports_config_yaml is not defined or openstack_instance_exporter_behavior_ports_config_yaml | trim | length == 0
      notify: Restart openstack_instance_exporter service

    - name: Render behavior rules configuration from inline YAML
      become: true
      ansible.builtin.copy:
        dest: "{{ openstack_instance_exporter_behavior_rules_config_path }}"
        content: "{{ openstack_instance_exporter_behavior_rules_config_yaml | trim ~ '\n' }}"
        owner: root
        group: root
        mode: '0644'
      when:
        - openstack_instance_exporter_behavior_rules_config_path is defined
        - openstack_instance_exporter_behavior_rules_config_yaml is defined
        - openstack_instance_exporter_behavior_rules_config_yaml | trim | length > 0
      notify: Restart openstack_instance_exporter service

    - name: Remove behavior rules configuration when inline YAML is empty
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_behavior_rules_config_path }}"
        state: absent
      when:
        - openstack_instance_exporter_behavior_rules_config_path is defined
        - openstack_instance_exporter_behavior_rules_config_yaml is not defined or openstack_instance_exporter_behavior_rules_config_yaml | trim | length == 0
      notify: Restart openstack_instance_exporter service

    - name: Reload openstack_instance_exporter service if changed
      become: true
      ansible.builtin.systemd:
        name: openstack_instance_exporter
        daemon_reload: yes
      when: oie_tar_download_result.changed or oie_template_result.changed

    - name: Enable and start openstack_instance_exporter service
      become: true
      ansible.builtin.systemd:
        name: openstack_instance_exporter
        enabled: yes
        state: started

- name: Disable openstack_instance_exporter when not enabled
  tags: install_oie
  when:
    - "'cleanup_oie' not in ansible_run_tags"
    - not (openstack_instance_exporter_enabled | bool)
  block:

    - name: Check whether the openstack_instance_exporter service exists
      become: true
      ansible.builtin.stat:
        path: /etc/systemd/system/openstack_instance_exporter.service
      register: oie_disabled_service_file

    - name: Stop and disable the openstack_instance_exporter service
      become: true
      ansible.builtin.systemd:
        name: openstack_instance_exporter
        enabled: no
        state: stopped
      when: oie_disabled_service_file.stat.exists

- name: OpenStack Instance Exporter Cleanup Tasks
  tags: never, cleanup_oie
  when: "'cleanup_oie' in ansible_run_tags"
  block:

    - name: Validate safe openstack_instance_exporter cleanup paths
      ansible.builtin.assert:
        that:
          - "(openstack_instance_exporter_install_dir | string) == (openstack_instance_exporter_install_dir | string | trim)"
          - "(openstack_instance_exporter_install_dir | string | trim) is match('^/')"
          - "((openstack_instance_exporter_install_dir | string | trim) | regex_replace('/+', '/')) != '/'"
          - "((openstack_instance_exporter_install_dir | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_customlist_path is not defined or (openstack_instance_exporter_customlist_path | string) == (openstack_instance_exporter_customlist_path | string | trim)"
          - "openstack_instance_exporter_customlist_path is not defined or (openstack_instance_exporter_customlist_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_customlist_path is not defined or ((openstack_instance_exporter_customlist_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_customlist_path is not defined or ((openstack_instance_exporter_customlist_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or (openstack_instance_exporter_behavior_ports_config_path | string) == (openstack_instance_exporter_behavior_ports_config_path | string | trim)"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or (openstack_instance_exporter_behavior_ports_config_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or ((openstack_instance_exporter_behavior_ports_config_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_behavior_ports_config_path is not defined or ((openstack_instance_exporter_behavior_ports_config_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or (openstack_instance_exporter_behavior_rules_config_path | string) == (openstack_instance_exporter_behavior_rules_config_path | string | trim)"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or (openstack_instance_exporter_behavior_rules_config_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or ((openstack_instance_exporter_behavior_rules_config_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_behavior_rules_config_path is not defined or ((openstack_instance_exporter_behavior_rules_config_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_log_file_path is not defined or (openstack_instance_exporter_log_file_path | string) == (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or (openstack_instance_exporter_log_file_path | string | trim) is match('^/')"
          - "openstack_instance_exporter_log_file_path is not defined or ((openstack_instance_exporter_log_file_path | string | trim) | regex_replace('/+', '/')) != '/'"
          - "openstack_instance_exporter_log_file_path is not defined or ((openstack_instance_exporter_log_file_path | string | trim) | regex_search('(^|/)[.][.]?(/|$)')) is none"
          - "openstack_instance_exporter_log_file_path is not defined or '*' not in (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or '?' not in (openstack_instance_exporter_log_file_path | string | trim)"
          - "openstack_instance_exporter_log_file_path is not defined or '[' not in (openstack_instance_exporter_log_file_path | string | trim)"
        fail_msg: "openstack_instance_exporter paths must be absolute, non-root, and traversal-free; the log path must not contain glob metacharacters"

    - name: Inspect openstack_instance_exporter file-valued paths before cleanup
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openstack_instance_exporter_customlist_path | default('') }}"
        - "{{ openstack_instance_exporter_behavior_ports_config_path | default('') }}"
        - "{{ openstack_instance_exporter_behavior_rules_config_path | default('') }}"
        - "{{ openstack_instance_exporter_log_file_path | default('') }}"
        - "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter"
        - "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter.tar.xz"
      when: item | length > 0
      register: oie_cleanup_file_path_stats

    - name: Reject directory-valued openstack_instance_exporter cleanup paths
      ansible.builtin.assert:
        that:
          - "not (item.stat.isdir | default(false))"
        fail_msg: "openstack_instance_exporter custom, behavior, log, and managed artifact paths must identify files, not directories"
      loop: "{{ oie_cleanup_file_path_stats.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Inspect openstack_instance_exporter installation directory before cleanup
      become: true
      ansible.builtin.stat:
        path: "{{ openstack_instance_exporter_install_dir }}"
        follow: false
      register: oie_cleanup_install_dir

    - name: Reject an unsafe existing openstack_instance_exporter cleanup path
      ansible.builtin.assert:
        that:
          - "not (oie_cleanup_install_dir.stat.exists | default(false)) or ((oie_cleanup_install_dir.stat.isdir | default(false)) and not (oie_cleanup_install_dir.stat.islnk | default(false)))"
        fail_msg: "openstack_instance_exporter_install_dir exists but is not a real directory"

    - name: Check if openstack_instance_exporter service file exists
      become: true
      ansible.builtin.stat:
        path: /etc/systemd/system/openstack_instance_exporter.service
      register: oie_service_file

    - name: Ensure openstack_instance_exporter service is stopped and disabled
      become: true
      ansible.builtin.systemd:
        name: openstack_instance_exporter
        state: stopped
        enabled: no
      when: oie_service_file.stat.exists

    - name: Remove openstack_instance_exporter systemd service file
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/openstack_instance_exporter.service
        state: absent
      register: service_file_removed

    - name: Reload systemd daemon if service file was removed
      become: true
      ansible.builtin.systemd:
        daemon_reload: yes
      when: service_file_removed.changed

    - name: Remove openstack_instance_exporter logrotate configuration
      become: true
      ansible.builtin.file:
        path: /etc/logrotate.d/openstack_instance_exporter
        state: absent

    - name: Remove custom IP list file (if path is defined)
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_customlist_path }}"
        state: absent
      when: openstack_instance_exporter_customlist_path is defined

    - name: Remove behavior ports config file
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_behavior_ports_config_path }}"
        state: absent
      when: openstack_instance_exporter_behavior_ports_config_path is defined

    - name: Remove behavior rules config file
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_behavior_rules_config_path }}"
        state: absent
      when: openstack_instance_exporter_behavior_rules_config_path is defined

    - name: Remove configured openstack_instance_exporter log file
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_log_file_path }}"
        state: absent
      when:
        - openstack_instance_exporter_log_file_path is defined
        - openstack_instance_exporter_log_file_path | length > 1

    - name: Find standard openstack_instance_exporter log files
      become: true
      ansible.builtin.find:
        paths: "{{ openstack_instance_exporter_log_file_path | dirname }}"
        patterns: '^{{ openstack_instance_exporter_log_file_path | basename | regex_escape }}\.[0-9]+(?:\.gz)?$'
        use_regex: true
        file_type: file
        recurse: false
        hidden: true
      register: oie_log_files
      when:
        - openstack_instance_exporter_log_file_path is defined
        - openstack_instance_exporter_log_file_path | length > 1

    - name: Remove standard openstack_instance_exporter log files
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ oie_log_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove managed openstack_instance_exporter installation artifacts
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter"
        - "{{ openstack_instance_exporter_install_dir }}/openstack_instance_exporter.tar.xz"
      when: oie_cleanup_install_dir.stat.isdir | default(false)

    - name: Inspect openstack_instance_exporter installation directory for unmanaged content
      become: true
      ansible.builtin.find:
        paths: "{{ openstack_instance_exporter_install_dir }}"
        file_type: any
        recurse: true
        hidden: true
        follow: false
      register: oie_unmanaged_install_entries
      when: oie_cleanup_install_dir.stat.isdir | default(false)

    - name: Refuse removal of an installation directory containing unmanaged content
      ansible.builtin.assert:
        that:
          - "(oie_unmanaged_install_entries.files | default([]) | length) == 0"
          - "(oie_unmanaged_install_entries.skipped_paths | default({}) | length) == 0"
        fail_msg: "openstack_instance_exporter_install_dir contains unmanaged content or could not be inspected completely and will not be removed"
      when: oie_cleanup_install_dir.stat.isdir | default(false)

    - name: Remove the empty openstack_instance_exporter installation directory
      become: true
      ansible.builtin.file:
        path: "{{ openstack_instance_exporter_install_dir }}"
        state: absent
      when:
        - oie_cleanup_install_dir.stat.isdir | default(false)
        - (oie_unmanaged_install_entries.files | default([]) | length) == 0
        - (oie_unmanaged_install_entries.skipped_paths | default({}) | length) == 0
